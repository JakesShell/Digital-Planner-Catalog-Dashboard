name: ProductAtlas CI

on:
  push:
    branches: [ main, productatlas-upgrade ]
  pull_request:
    branches: [ main ]

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build dashboard
        run: npm run build
